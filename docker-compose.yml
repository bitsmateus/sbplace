services:
  sbplace:
    build: .
    ports:
      - "3000:3000"
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-troque-esta-senha}
      SESSION_SECRET: ${SESSION_SECRET:-gere-uma-chave-aleatoria-longa-aqui}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-5548999999999}
      NEXT_PUBLIC_INSTAGRAM: ${NEXT_PUBLIC_INSTAGRAM:-sbplaceoficial}
      NEXT_PUBLIC_ADDRESS: ${NEXT_PUBLIC_ADDRESS:-Tubarão / SC}
      DATA_DIR: /app/data
    volumes:
      - sbplace_data:/app/data
    restart: unless-stopped

volumes:
  sbplace_data:
